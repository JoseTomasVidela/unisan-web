name: Build and deploy UNISAN to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify build
        run: |
          echo "Checking dist/server..."
          test -f dist/server/index.js
          echo "Checking server _next..."
          test -d dist/server/_next
          echo "Checking client _next..."
          test -d dist/client/_next
          echo "Build looks complete."

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'unisan-demo'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_84CCC93C6B7B4A31B26E66B33CCCB078 }}
